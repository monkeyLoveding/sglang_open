name: Test OIDC on pull_request

on:
  pull_request:
    branches: [main]
  push:
    branches: [oidc-test]

permissions:
  id-token: write
  contents: read

jobs:
  wf-level-only:
    runs-on: ubuntu-latest
    steps:
      - name: Try request OIDC token (workflow-level declaration)
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "WF-LEVEL: env vars PRESENT, requesting token..."
            curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=oidc-experiment" | head -c 100
          else
            echo "WF-LEVEL: env vars MISSING => id-token NOT granted"
          fi

  job-level-control:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Control - job-level declaration
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "JOB-LEVEL: env vars PRESENT, requesting token..."
            curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=oidc-experiment" | head -c 100
          else
            echo "JOB-LEVEL: env vars MISSING => id-token NOT granted"
          fi
