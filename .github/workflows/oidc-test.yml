name: Test OIDC on pull_request

on:
  pull_request:
    branches: [main]
  push:
    branches: [oidc-test]

permissions:
  id-token: write
  contents: read

jobs:
  oidc-minimal:
    runs-on: ubuntu-latest
    steps:
      - name: Dump OIDC env
        run: printenv | grep -E '^(ACTIONS_ID_TOKEN|GITHUB_EVENT_NAME|GITHUB_REPOSITORY)=' || echo "no ID_TOKEN env vars"
